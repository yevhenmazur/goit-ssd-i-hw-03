replicaCount: 2

image:
  repository: user-api
  tag: "1.0.0"            # або commit SHA; latest заборонити policy
  pullPolicy: IfNotPresent

containerPort: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

env: []
